[profile.default]
src = "src"
out = "out"
libs = ["lib"]
evm_version = "cancun"
solc = "0.8.26"
optimizer = true
# Lowered from 99999 so the per-token basket vault fits EIP-170 (24 KB runtime) and its factory — which
# deploys the vault impl + basket deployer in its constructor (FreeCoin pattern) — fits EIP-3860 (49 KB
# initcode). At 1000 runs: vault runtime 22.5 KB, factory initcode 47.8 KB (both within limits).
optimizer_runs = 1000
fs_permissions = [{ access = "read", path = "./" }]

# BSC mainnet fork target (chainId 56). Override via env: BSC_RPC_URL
[rpc_endpoints]
bsc = "${BSC_RPC_URL}"
