[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
ffi = false
fs_permissions = [{ access = "read", path = "./" }, { access = "read-write", path = "./deployments" }]

remappings = [
    "forge-std/=lib/forge-std/src/",
    # Core (everything except the vault subtrees) — OpenZeppelin v5.
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    # Flap vault (src/vault/ + test/vault/) — OpenZeppelin v4.9.6, context-scoped so its bare
    # `@openzeppelin/...` prefix resolves to v4 ONLY inside the vault dirs and never touches the core.
    "src/vault/:@openzeppelin/=lib/openzeppelin-contracts-v4/contracts/",
    "src/vault/:@openzeppelin-contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable-v4/contracts/",
    "test/vault/:@openzeppelin/=lib/openzeppelin-contracts-v4/contracts/",
    "test/vault/:@openzeppelin-contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable-v4/contracts/",
]

# BSC mainnet fork target (chainId 56). Override via env: BSC_RPC_URL
[rpc_endpoints]
bsc = "${BSC_RPC_URL}"
bsc_testnet = "${BSC_TESTNET_RPC_URL}"

[etherscan]
bsc = { key = "${BSCSCAN_API_KEY}", chain = 56 }

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = true

# Stateful invariant / fuzz settings. Kept modest so the suite stays fast; the handler
# try/catches expected reverts, so fail_on_revert is disabled to let sequences continue.
[invariant]
runs = 64
depth = 32
fail_on_revert = false

# `forge doc` renders NatSpec here (generated; gitignored) to keep docs/ clean for hand-written md.
[doc]
out = "docs/api"
